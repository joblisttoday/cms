<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" type="image/jpg" href="./media/favicon.ico" />
		<title>edit | joblist</title>
	</head>
	<body>
		<script>
			// enable netlify-cms manual initialization before loading it
			window.CMS_MANUAL_INIT = true;
		</script>

		<!-- load netlify-cms dependency form cdn -->
		<script src="https://unpkg.com/decap-cms@latest"></script>
		<script
			src="https://cdn.jsdelivr.net/npm/@joblist/components@0.1.16"
			type="module"
		></script>
		<style>
			@import url("https://cdn.jsdelivr.net/npm/@joblist/components@0.1.16/dist-lib/style.css");
		</style>

		<script type="module">
			import options from "./js/options.js";
			import registerPreviewTemplate from "./js/templates.js";

			// initialize cms with our configuration options
			window.initCMS(options);
			registerPreviewTemplate(window.CMS);
		</script>
	</body>
</html>
